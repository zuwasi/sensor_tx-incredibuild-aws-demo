# ============================================================================
# Parasoft C/C++test scan settings - EXAMPLE (copy, fill in, do not commit)
#
#   cpptest-scan-localsettings.example.properties  <- this template
#   cpptest-scan-localsettings.properties          <- your real file (gitignored)
#
# Used by scan_benchmark.ps1. The values below must point to YOUR Parasoft
# DTP server, which serves your network license.
# ============================================================================

# --- License: connect to your DTP server ------------------------------------
# The encoded password is produced with:
#   cpptestcli.exe -encodepass <YOUR_DTP_PASSWORD>
cpptest.license.use_network=true
dtp.url=https://YOUR_DTP_HOST:8443
dtp.user=admin
dtp.password=<OUTPUT_OF_cpptestcli_-encodepass>

# --- License edition and features -------------------------------------------
# Explicit feature list. Without this, cpptestcli activates an edition that
# lacks Flow Analysis / Security Rules and reports 0 violations.
cpptest.license.network.edition=custom_edition
cpptest.license.custom_edition_features=C++test,Static Analysis,Flow Analysis,Unit Test,Coverage,Automation,DTP Publish,Security Rules,Coding Standards,MISRA Rules,CWE Rules,SEI CERT C Rules,Desktop Command Line

# --- Console verbosity -------------------------------------------------------
console.verbosity.level=high
